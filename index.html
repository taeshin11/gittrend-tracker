  <style>
    #feedback-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #2563EB;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(37,99,235,0.45);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #feedback-fab:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(37,99,235,0.6); }
    #feedback-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 10000;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 24px;
    }
    #feedback-modal-overlay.open { display: flex; }
    #feedback-modal {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      width: 320px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      position: relative;
    }
    #feedback-modal h3 { margin: 0 0 12px; font-size: 1rem; font-weight: 600; color: #111827; }
    #feedback-modal textarea {
      width: 100%;
      min-height: 100px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #111827;
      padding: 10px;
      font-size: 0.875rem;
      resize: vertical;
      box-sizing: border-box;
      font-family: inherit;
    }
    #feedback-modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
    #feedback-submit-btn {
      background: #2563EB;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
    }
    #feedback-submit-btn:hover { background: #1d4ed8; }
    #feedback-close-btn {
      background: transparent;
      border: 1px solid #d1d5db;
      color: #374151;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.875rem;
    }
  </style>

  <button id="feedback-fab" aria-label="Send Feedback" title="Send Feedback">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>

  <div id="feedback-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title">
    <div id="feedback-modal">
      <h3 id="feedback-modal-title" data-i18n="feedbackModalTitle">Send Feedback</h3>
      <textarea id="feedback-text" data-i18n-placeholder="feedbackPlaceholder" placeholder="Your message..."></textarea>
      <div id="feedback-modal-actions">
        <button id="feedback-close-btn" data-i18n="feedbackClose">Close</button>
        <button id="feedback-submit-btn" data-i18n="feedbackSubmit">Send</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var fab = document.getElementById('feedback-fab');
      var overlay = document.getElementById('feedback-modal-overlay');
      var closeBtn = document.getElementById('feedback-close-btn');
      var submitBtn = document.getElementById('feedback-submit-btn');
      var textarea = document.getElementById('feedback-text');

      function openModal() { overlay.classList.add('open'); textarea.focus(); }
      function closeModal() { overlay.classList.remove('open'); textarea.value = ''; }

      fab.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

      submitBtn.addEventListener('click', function() {
        var msg = textarea.value.trim();
        if (!msg) return;
        var subject = encodeURIComponent('[GitTrend Tracker] Feedback');
        var body = encodeURIComponent(msg);
        window.open('mailto:taeshinkim11@gmail.com?subject=' + subject + '&body=' + body, '_blank');
        closeModal();
      });
    })();
  </script>
